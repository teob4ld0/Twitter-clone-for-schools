<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#1da1f2" />
    <meta name="description" content="Twittetec - Red social moderna. Conecta, comparte y chatea con tus amigos" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Twittetec" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Twittetec - Red Social</title>
    <!-- Script para aplicar tema antes de que React cargue (evita flash) -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('app-theme');
          const theme = savedTheme === 'dark' ? 'dark' : 'light';
          // Usar documentElement en lugar de body ya que body aún no existe aquí
          document.documentElement.setAttribute('data-theme', theme);
          // También preparar el body cuando esté disponible
          if (document.body) {
            document.body.setAttribute('data-theme', theme);
          }
        } catch (e) {
          // Si falla, usar tema claro por defecto
          document.documentElement.setAttribute('data-theme', 'light');
          if (document.body) {
            document.body.setAttribute('data-theme', 'light');
          }
        }
      })();
    </script>
  </head>
  <body data-theme="light">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
